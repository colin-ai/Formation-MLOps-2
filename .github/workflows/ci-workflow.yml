name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run ruff
        run: uv run ruff check --output-format=github --target-version=py39
      - name: Run tests
        run: uv run pytest
      - name: Run vulture
        run: uv run --with vulture ./
      - name: Run bandit
        run: uv run bandit

